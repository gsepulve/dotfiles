[mgr]
prepend_keymap = [
    { on = "<End>", run = [ "plugin split-tabs spl_toggle", "plugin split-tabs spl_preview"], desc = "Split-tabs: toggle split tabs mode" },
	{ on = "<S-Tab>", run = [ "plugin split-tabs spl_toggle", "plugin split-tabs spl_preview"], desc = "Split-tabs: toggle split tabs mode" },
    { on = "<F5>", run = [ "escape --visual", "plugin split-tabs spl_copy" ], desc = "Split-tabs: copy to the other pane" },
    { on = "<F6>", run = [ "escape --visual", "plugin split-tabs spl_move" ], desc = "Split-tabs: move to the other pane" },
    { on = "P", run = "plugin split-tabs spl_preview", desc = "Split-tabs: toggle preview pane" },

    { on = "<Tab>", run = "plugin split-tabs spl_switch_tab", desc = "Split-tabs: switch to the other pane" },
    { on = "<G>", run = "arrow bot", desc = "Go to end of folder" },

	{ on = "<Print>", run = "paste --smart", desc = "Paste inside selected folder" },
	{ on = "<Enter>", run = "plugin smart-enter", desc = "Enter directory or open file" },
	{ on = "<Backspace>", run = "leave", desc = "Go to parent directory" },
]
